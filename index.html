<!DOCTYPE html>

        * {

        body {

            background: linear-gradient(135deg, #1a3a3a 0%, #2d4a3a 100%);

        .container {

        }

        .logo {

        }

        h1 {

            color: #d4af37;

            border: 2px solid #d4af37;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cormorant Garamond', serif;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .btn:hover {
            background: #d4af37;
            color: #1a3a3a;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #a7b791 100%);
            color: #1a3a3a;
            border: none;
        }

        .btn-primary:hover {
